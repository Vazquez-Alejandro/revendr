<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Logo/Brand mark -->
  <g transform="translate(100, 260)">
    <!-- Rocket/Sales icon -->
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#8b5cf6" opacity="0.9"/>
    <path d="M30 10 L45 30 L35 30 L35 50 L25 50 L25 30 L15 30 Z" fill="#0f172a"/>
    <circle cx="30" cy="35" r="5" fill="#8b5cf6"/>
  </g>
  
  <!-- App name -->
  <text x="180" y="300" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="700" fill="white">
    Revendr
  </text>
  
  <!-- Tagline -->
  <text x="100" y="370" font-family="Inter, -apple-system, sans-serif" font-size="24" fill="#94a3b8">
    Motor SaaS de Prospección Automatizada
  </text>
  
  <!-- Features -->
  <text x="100" y="420" font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#64748b">
    Demos personalizadas • WhatsApp masivo • Stripe • Multi-rubro
  </text>
  
  <!-- URL -->
  <text x="100" y="550" font-family="Inter, -apple-system, sans-serif" font-size="16" fill="#8b5cf6">
    revendr.app
  </text>
  
  <!-- Decorative elements -->
  <circle cx="1100" cy="100" r="80" fill="#8b5cf6" opacity="0.1"/>
  <circle cx="1050" cy="500" r="60" fill="#8b5cf6" opacity="0.08"/>
</svg>
